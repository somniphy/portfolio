<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Christian Penales</title>
    <link rel="stylesheet" href="src/style.css" />
  </head>
  <body>
    <nav>
      <div class="nav-logo">
        <a href="/index">Christian Penales</a>
        <p>UI/UX Designer + Web Developer</p>
      </div>
      <div class="nav-items">
        <a href="/index" class="roll">
          <span class="text">Index</span>
          <span class="text">Index</span>
        </a>
        <a href="/about" class="roll">
          <span class="text">About</span>
          <span class="text">About</span>
        </a>
      </div>
    </nav>
    <section class="hero">
      <div class="hero-overlay">
        <div class="counter">
          <h1>0</h1>
        </div>
        <div class="overlay-text-container">
          <div class="overlay-text">
            <p>UX/UI</p>
            <p>Web Development</p>
            <p>Graphic Design</p>
          </div>
        </div>
      </div>
      <!--loader images-->
      <div class="hero-images">
        <div class="img">
          <img src="/minimap-assets/iced-cover.jpg" alt="" />
        </div>
        <div class="img">
          <img src="/minimap-assets/sailfast-cover.jpg" alt="" />
        </div>
        <div class="img">
          <img src="/minimap-assets/relai-cover.jpg" alt="" />
        </div>
        <div class="img">
          <img src="/minimap-assets/zypto-cover.jpg" alt="" />
        </div>
        <div class="img">
          <img src="/minimap-assets/studio-cover.jpg" alt="" />
        </div>
      </div>

      <div class="container">
        <div class="img-preview">
          <div class="img-preview-overlay"></div>
          <img src="/minimap-assets/relai-cover.jpg" alt="" />
        </div>

        <div class="minimap">
          <div class="indicator"></div>
          <div class="items">
            <div class="item">
              <img src="/minimap-assets/relai-cover.jpg" alt="" />
            </div>
            <div class="item">
              <img src="/minimap-assets/sailfast-cover.jpg" alt="" />
            </div>
            <div class="item">
              <img src="/minimap-assets/studio-cover.jpg" alt="" />
            </div>
            <div class="item">
              <img src="/minimap-assets/zypto-cover.jpg" alt="" />
            </div>
            <div class="item">
              <img src="/minimap-assets/iced-cover.jpg" alt="" />
            </div>
          </div>
        </div>
      </div>
    </section>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/minimap.js"></script>
  </body>
</html>
